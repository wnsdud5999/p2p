<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>D-Day Timer</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #000000;
      --fg: #ffffff;
      --track: rgba(255, 255, 255, 0.14);
      --soft: rgba(255, 255, 255, 0.6);
      --ring-gap: 14px;
      --shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(circle at top, rgba(255, 255, 255, 0.08), transparent 28%),
        linear-gradient(180deg, #050505 0%, #000000 40%, #000000 100%);
      color: var(--fg);
      font-family: "Trebuchet MS", "Arial Narrow", sans-serif;
      letter-spacing: 0.05em;
    }

    .page {
      min-height: 100vh;
      width: min(920px, 100%);
      margin: 0 auto;
      padding: 24px 14px 34px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 20px;
    }

    .config-note {
      margin: 0;
      text-align: center;
      font-size: 0.68rem;
      line-height: 1.55;
      color: rgba(255, 255, 255, 0.42);
      text-transform: uppercase;
    }

    .hero {
      text-align: center;
    }

    .hero-title {
      margin: 0;
      font-size: clamp(1.9rem, 5vw, 4rem);
      font-weight: 900;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    .hero-subtitle {
      margin: 10px 0 0;
      color: var(--soft);
      font-size: clamp(0.78rem, 1.4vw, 0.92rem);
      letter-spacing: 0.16em;
      text-transform: uppercase;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
      align-items: stretch;
      overflow-x: auto;
      padding: 4px 0 8px;
      scrollbar-width: thin;
    }

    .timer-ring {
      --progress: 0;
      position: relative;
      width: min(100%, 180px);
      min-width: 130px;
      aspect-ratio: 1 / 1;
      margin: 0 auto;
      border-radius: 50%;
      background:
        conic-gradient(
          var(--track) 0turn calc(var(--progress) * 1turn),
          var(--fg) calc(var(--progress) * 1turn) 1turn
        );
      box-shadow: var(--shadow);
      overflow: hidden;
      will-change: background;
    }

    .timer-ring::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.12);
    }

    .timer-core {
      position: absolute;
      inset: var(--ring-gap);
      border-radius: 50%;
      background: var(--bg);
      border: 1px solid rgba(255, 255, 255, 0.18);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 16px;
      z-index: 1;
    }

    .timer-value {
      margin: 0;
      font-size: clamp(1.45rem, 2.5vw, 2.25rem);
      font-weight: 900;
      line-height: 1;
    }

    .timer-label {
      margin: 8px 0 0;
      font-size: 0.68rem;
      color: var(--soft);
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }
  </style>
</head>
<!--
  EASY EDIT
  Change only these 2 values below:
  data-title="YOUR TITLE"
  data-target-date="20261006"  -> use YYYYMMDD
-->
<body data-title="MY D-DAY" data-target-date="20261006">
  <main class="page">
    <p class="config-note">Edit `data-title` and `data-target-date` inside this HTML file to change the title and date fast.</p>

    <section class="hero">
      <h1 class="hero-title" id="main-title">MY D-DAY</h1>
      <p class="hero-subtitle" id="target-label">TARGET 2026.10.06</p>
    </section>

    <section class="timer-grid" aria-label="D-Day countdown">
      <article class="timer-ring" id="ring-years">
        <div class="timer-core">
          <p class="timer-value" id="value-years">0</p>
          <p class="timer-label">Year</p>
        </div>
      </article>

      <article class="timer-ring" id="ring-days">
        <div class="timer-core">
          <p class="timer-value" id="value-days">0</p>
          <p class="timer-label">Day</p>
        </div>
      </article>

      <article class="timer-ring" id="ring-hours">
        <div class="timer-core">
          <p class="timer-value" id="value-hours">0</p>
          <p class="timer-label">Hour</p>
        </div>
      </article>

      <article class="timer-ring" id="ring-seconds">
        <div class="timer-core">
          <p class="timer-value" id="value-seconds">0</p>
          <p class="timer-label">Second</p>
        </div>
      </article>
    </section>
  </main>

  <script>
    const SECOND_MS = 1000;
    const MINUTE_MS = 60 * SECOND_MS;
    const HOUR_MS = 60 * MINUTE_MS;
    const DAY_MS = 24 * HOUR_MS;

    const pageConfig = {
      title: document.body.dataset.title || "MY D-DAY",
      targetDateRaw: document.body.dataset.targetDate || "20261006"
    };

    const titleElement = document.getElementById("main-title");
    const targetLabelElement = document.getElementById("target-label");

    const ringElements = {
      years: document.getElementById("ring-years"),
      days: document.getElementById("ring-days"),
      hours: document.getElementById("ring-hours"),
      seconds: document.getElementById("ring-seconds")
    };

    const valueElements = {
      years: document.getElementById("value-years"),
      days: document.getElementById("value-days"),
      hours: document.getElementById("value-hours"),
      seconds: document.getElementById("value-seconds")
    };

    function clamp(value, min, max) {
      return Math.min(Math.max(value, min), max);
    }

    function parseTargetDate(raw) {
      const match = String(raw).trim().match(/^(\d{4})(\d{2})(\d{2})$/);

      if (!match) {
        return null;
      }

      const year = Number(match[1]);
      const month = Number(match[2]) - 1;
      const day = Number(match[3]);
      const date = new Date(year, month, day, 0, 0, 0, 0);

      if (
        date.getFullYear() !== year ||
        date.getMonth() !== month ||
        date.getDate() !== day
      ) {
        return null;
      }

      return date;
    }

    function formatTargetLabel(date) {
      const year = date.getFullYear();
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${year}.${month}.${day}`;
    }

    function getFullYearsBetween(start, end) {
      let years = end.getFullYear() - start.getFullYear();
      const candidate = new Date(start);
      candidate.setFullYear(candidate.getFullYear() + years);

      if (candidate > end) {
        years -= 1;
      }

      return Math.max(0, years);
    }

    function getYearChunkDays(anchorDate) {
      const nextYear = new Date(anchorDate);
      nextYear.setFullYear(nextYear.getFullYear() + 1);
      return Math.round((nextYear - anchorDate) / DAY_MS);
    }

    function setRingProgress(element, progress) {
      element.style.setProperty("--progress", clamp(progress, 0, 1).toFixed(6));
    }

    function getCycleProgress(remainingAmount, fullAmount) {
      if (fullAmount <= 0 || remainingAmount <= 0) {
        return 0;
      }

      return clamp((fullAmount - remainingAmount) / fullAmount, 0, 1);
    }

    function updateTimer(targetDate, initialCountdownMs) {
      const now = new Date();
      const totalRemaining = targetDate - now;

      if (totalRemaining <= 0) {
        valueElements.years.textContent = "0";
        valueElements.days.textContent = "0";
        valueElements.hours.textContent = "0";
        valueElements.seconds.textContent = "0";

        setRingProgress(ringElements.years, 1);
        setRingProgress(ringElements.days, 1);
        setRingProgress(ringElements.hours, 1);
        setRingProgress(ringElements.seconds, 1);
        return;
      }

      let years = getFullYearsBetween(now, targetDate);
      let yearAnchor = new Date(now);
      yearAnchor.setFullYear(yearAnchor.getFullYear() + years);

      if (yearAnchor > targetDate) {
        years -= 1;
        yearAnchor = new Date(now);
        yearAnchor.setFullYear(yearAnchor.getFullYear() + years);
      }

      const remainingAfterYears = targetDate - yearAnchor;
      const days = Math.floor(remainingAfterYears / DAY_MS);
      const remainingAfterDays = remainingAfterYears - days * DAY_MS;
      const hours = Math.floor(remainingAfterDays / HOUR_MS);
      const remainingAfterHours = remainingAfterDays - hours * HOUR_MS;
      const minutes = Math.floor(remainingAfterHours / MINUTE_MS);
      const remainingAfterMinutes = remainingAfterHours - minutes * MINUTE_MS;
      const seconds = Math.floor(remainingAfterMinutes / SECOND_MS);
      const milliseconds = remainingAfterMinutes - seconds * SECOND_MS;

      const secondsRemaining = seconds + milliseconds / SECOND_MS;
      const hoursRemaining =
        hours + minutes / 60 + seconds / 3600 + milliseconds / HOUR_MS;
      const yearChunkDays = getYearChunkDays(yearAnchor);
      const daysRemaining =
        days +
        hours / 24 +
        minutes / 1440 +
        seconds / 86400 +
        milliseconds / DAY_MS;

      const secondsProgress = getCycleProgress(secondsRemaining, 60);
      const hoursProgress = getCycleProgress(hoursRemaining, 24);
      const daysProgress = getCycleProgress(daysRemaining, yearChunkDays);
      const yearsProgress = clamp(
        (initialCountdownMs - totalRemaining) / initialCountdownMs,
        0,
        1
      );

      valueElements.years.textContent = String(years);
      valueElements.days.textContent = String(days);
      valueElements.hours.textContent = String(hours).padStart(2, "0");
      valueElements.seconds.textContent = String(seconds).padStart(2, "0");

      setRingProgress(ringElements.years, yearsProgress);
      setRingProgress(ringElements.days, daysProgress);
      setRingProgress(ringElements.hours, hoursProgress);
      setRingProgress(ringElements.seconds, secondsProgress);
    }

    function showInvalidState() {
      titleElement.textContent = pageConfig.title;
      targetLabelElement.textContent = "USE YYYYMMDD FOR THE DATE";

      valueElements.years.textContent = "-";
      valueElements.days.textContent = "-";
      valueElements.hours.textContent = "-";
      valueElements.seconds.textContent = "-";

      setRingProgress(ringElements.years, 0);
      setRingProgress(ringElements.days, 0);
      setRingProgress(ringElements.hours, 0);
      setRingProgress(ringElements.seconds, 0);
    }

    titleElement.textContent = pageConfig.title;

    const targetDate = parseTargetDate(pageConfig.targetDateRaw);

    if (!targetDate) {
      showInvalidState();
    } else {
      targetLabelElement.textContent = `TARGET ${formatTargetLabel(targetDate)}`;
      const initialCountdownMs = Math.max(targetDate - new Date(), 1);
      function animateTimer() {
        updateTimer(targetDate, initialCountdownMs);
        requestAnimationFrame(animateTimer);
      }

      animateTimer();
    }
  </script>
</body>
</html>
